# 对标组判定策略回归标注集（scripts/peer_group_eval.py 的输入；设计 docs/design/PEER_GROUP_JUDGMENT_DESIGN.md §5/§6）。
#
# 每个 case：一个标的 + 一个**冻结候选池** + 逐候选 ground truth（label: keep/drop）。
#
# 候选池来源（pool_source 字段逐例写明，**不由本次 LLM 现场生成**）：
#   - `harness 首采缓存 ∪ 同 L3 成分`：来自 data/peer_eval_cache/<symbol>.json 的历史 LLM 产出
#     （2026-10 首采），并按 alphabee/static/all_stocks.csv 的申万 L3 成分补齐；
#   - `同 L2/L3 公开分类冻结`：未做过 LLM 首采的 case，按 alphabee/static/all_stocks.csv 的
#     申万 L2/L3 成分（公开分类，非 LLM 现生成）取真实同行业公司，冻结在文件内。
# E 的 same_l3/same_l2 由脚本从 alphabee/static/all_stocks.csv 现算（不写进本文件）。
#
# 划分依据（split 字段）：**按业态分层**而非按行业单堆——六个业态各 ≥1 例，且 holdout 覆盖
#   同质 L3 / 分类冲突 / 残差桶 / 境内外混合 / 无对标空组 / 跨行业 六类中的六类（残差桶进入 holdout
#   后已全覆盖，每类各 1 例；跨行业与空组整体各只 2 例，按分层各拿 1 例）；
#   holdout 共享同一套候选池（同行业）会系统性偏乐观，故按业态分层。
#   **本行「六类中的N类」为定量散文，N 由 tests/company_track/test_peer_group_eval.py 现算校验**
#   （现算值 = holdout 子集的业态集合大小），改 split/segment 必须同步，否则该用例必红。
#
# 元数据自洽（**下列分账行与机器可读字段程序化一致，由 tests/company_track/test_peer_group_labels.py 现算校验**；
# 改动任一 case 的 split/segment 必须同步下列数字，否则该测试必红。禁止在测试里硬编码例数）：
#   split_counts: total=19, train=13, holdout=6, holdout_ratio=31.6%
#   segment_counts: 同质 L3=4, 分类冲突=4, 残差桶=4, 境内外混合=2, 无对标空组=2, 跨行业=3
#   holdout_segments: 同质 L3, 分类冲突, 残差桶, 境内外混合, 无对标空组, 跨行业
#   **阈值/权重只能看 train 段，holdout 仅用于验收。**
#
# 六类业态（segment 字段）：
#   - 同质 L3：候选池基本落在同一申万 L3，真对标与同 L3 假对标混在一起（考 D 的区分力）；
#   - 分类冲突：同 L3 里有必须 drop 的候选、跨 L3 里反而有必须 keep 的候选（考 E 不能硬闸）；
#   - 残差桶：L3 名以「其他」开头，或 L3 成分数少（< 15）导致同 L3 严重异质（考分类学不可信时的降级）；
#   - 境内外混合：候选含非 A 股代码（TW/US/HK），考跨市场同行的处理；
#   - 无对标空组：expect_empty: true（考「宁可不给」而不是硬凑对标组）；
#   - 跨行业：与既有四例不同的一级行业（银行/保险/煤炭/乳品 等非电子制造）。
#
# 边界争议候选以 `disputed: true` 标注（可选字段，缺省 False）：其 keep/drop 需独立分析师确认（设计 §5.2）。
# 报告对每个 split 同时给出『排除 disputed』与『未排除 disputed』两套数字，本文件不做单口径定论。

