# 六阶段状态机的迁移约束（Markov 风格，Phase 2.1）
#
# 主循环：吸筹期 → 趋势启动 → 趋势加速 → 高位分歧 → 风险释放 → 底部修复 →（回吸筹期）
#
# transitions 定义每个阶段允许迁移到的下一阶段集合：
#   - 允许停留在本阶段（自环，市场可以在一个阶段停留数周）；
#   - 允许沿主循环向前推进（进入下一阶段）；
#   - 允许回退一步（突破失败/二次探底的折返）。
# 不在集合中的迁移（如"高位分歧"直接跳"趋势启动"）由 regime_classifier 标记为
# suspicious，交由人工/LLM 复核，而不是静默接受。

phases:
  - 吸筹期
  - 趋势启动
  - 趋势加速
  - 高位分歧
  - 风险释放
  - 底部修复

transitions:
  吸筹期: [吸筹期, 趋势启动, 底部修复]
  趋势启动: [趋势启动, 趋势加速, 吸筹期]
  趋势加速: [趋势加速, 高位分歧, 趋势启动]
  高位分歧: [高位分歧, 风险释放, 趋势加速]
  风险释放: [风险释放, 底部修复, 高位分歧]
  底部修复: [底部修复, 吸筹期, 风险释放]
