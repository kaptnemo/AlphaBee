# AlphaBee Tushare Adapter — 市场状态域字段映射
# API: index_dailybasic()、shibor()、us_tycr()、cn_m()、sf_month()、margin()
#
# 注意：本映射描述 tushare 源字段 → AlphaBee canonical 字段的对应关系。
# 采集器（alphabee/collectors/market_regime/tushare.py）按该映射提取字段。
# 实际权限校验：当前 token 无法访问 yield_cnbd（中债收益率），该字段由
# akshare 数据源兜底（见 INDEX.yaml field_gaps 与 data.py source=auto）。

# ─────────────────────────────────────────
# 指数估值 index_dailybasic()
# 每只指数一行；pe_ttm/pb 按 ts_code 归属映射到对应前缀字段
# ─────────────────────────────────────────
index_dailybasic:
  pe_ttm: pe_ttm          # 实际按 index_code_map 映射，如 000300.SH → hs300_pe_ttm
  pb: pb

# ─────────────────────────────────────────
# SHIBOR shibor()
# ─────────────────────────────────────────
shibor:
  "3m": shibor_3m

# ─────────────────────────────────────────
# 美债收益率 us_tycr()
# ─────────────────────────────────────────
us_tycr:
  y10: us_10y_yield

# ─────────────────────────────────────────
# 货币供应 cn_m()
# ─────────────────────────────────────────
cn_m:
  m1_yoy: m1_yoy
  m2_yoy: m2_yoy

# ─────────────────────────────────────────
# 社融增量 sf_month()
# ─────────────────────────────────────────
sf_month:
  inc_month: social_financing_increment

# ─────────────────────────────────────────
# 两融 margin()
# 每交易日按交易所多行；rzye 为融资余额（元），adapter 层求和 /1e8 换算为亿元
# ─────────────────────────────────────────
margin:
  rzye: margin_balance

# 指数代码 → canonical 字段前缀
# 单指数行情接口返回的 pe_ttm/pb 需按指数归属映射到对应字段
index_code_map:
  "000300.SH": hs300
  "000905.SH": cs500
  "000852.SH": cs1000
  "399006.SZ": cyb

# 衍生字段（adapter/采集器层计算规则）
derived:
  hs300_ep_ttm: "100 / hs300_pe_ttm"
  cs500_ep_ttm: "100 / cs500_pe_ttm"
  cs1000_ep_ttm: "100 / cs1000_pe_ttm"
  cyb_ep_ttm: "100 / cyb_pe_ttm"
  m1_m2_gap: "m1_yoy - m2_yoy"
