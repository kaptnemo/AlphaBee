name: roe_level
description: 净资产收益率（ROE = 净利润 / 平均净资产），衡量股东权益的盈利效率；是巴菲特护城河分析的核心指标
required_facts:
  - net_profit
  - avg_shareholders_equity
formula: net_profit / avg_shareholders_equity
thresholds:
  # 三级回退链（COMPANY_TRACK Phase D，零引擎改动，见 registry.py 表达式列表语义）：
  # peer_avg_roe（对标组）→ industry_avg_roe（申万基线）→ 绝对阈值；
  # 前序表达式引用的字段缺失时抛异常 → 顺延下一级。
  excellent:
    - "value >= peer_avg_roe * 1.5"
    - "value >= industry_avg_roe * 1.5"
    - "value >= 0.15"
  good:
    - "value >= peer_avg_roe * 0.8 and value < peer_avg_roe * 1.5"
    - "value >= industry_avg_roe * 0.8 and value < industry_avg_roe * 1.5"
    - "0.08 <= value <= 0.15"
  weak:
    - "value < peer_avg_roe * 0.8"
    - "value < industry_avg_roe * 0.8"
    - "value < 0.08"
interpretation:
  # P1-5：分档感知文案——三级回退链下 excellent 可能由「行业均值 1.5 倍」命中
  # （如 12.8% vs industry_avg_roe 8%），不得写死「ROE ≥ 15%」绝对口径；
  # 文案按判定口径描述：相对 1.5 倍优先、绝对 15% 仅作回退线。
  excellent: ROE 显著高于行业或对标组均值（1.5 倍以上），或达到 15% 优秀绝对线，股东权益回报优秀，通常具备较强的品牌护城河或规模壁垒
  good: ROE 处于行业或对标组均值的 0.8–1.5 倍区间（绝对口径 8%–15%），盈利能力尚可，需结合行业均值与杜邦拆解综合评估
  weak: ROE 低于行业或对标组均值的 0.8 倍，或低于 8% 绝对线，权益回报偏低，可能存在资产利用效率低下或盈利能力不足问题
