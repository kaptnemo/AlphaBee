# ── 精选申万二级（仅收录行业组/别名解析需要的成员；完整 L2 目录可按需扩充）──
l2:
  sw_l2:801081.SI: 半导体
  sw_l2:801193.SI: 证券Ⅱ
  sw_l2:801194.SI: 保险Ⅱ
