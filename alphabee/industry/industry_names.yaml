# ── 别名/惯用名 → 规范名（用于名称归一与行业 key 解析；值为去掉罗马后缀的基础名）──
aliases:
  芯片: 半导体
  券商: 证券
  医药: 医药生物
  家电: 家用电器
  纺织: 纺织服饰
  食品: 食品饮料
  化工: 基础化工
  军工: 国防军工
  公用: 公用事业
  交通: 交通运输
  电力: 电力设备

# ── 行业组（迁移自 thesis engine/reviewer 的硬编码中文名集合；值为行业 key）──
groups:
  # 天然高杠杆行业（负债率高属正常经营特征）
  high_leverage:
    - sw_l1:801780.SI   # 银行
    - sw_l1:801180.SI   # 房地产
    - sw_l2:801193.SI   # 证券Ⅱ
    - sw_l2:801194.SI   # 保险Ⅱ
    - sw_l1:801720.SI   # 建筑装饰
  # 高研发投入行业（短期盈利弱化可能是战略投入）
  high_rd:
    - sw_l1:801080.SI   # 电子
    - sw_l2:801081.SI   # 半导体
    - sw_l1:801150.SI   # 医药生物
    - sw_l1:801750.SI   # 计算机
    - sw_l1:801770.SI   # 通信
  # 金融行业（报表结构特殊，通用财务指标适用性有限）
  financial:
    - sw_l1:801780.SI   # 银行
    - sw_l2:801193.SI   # 证券Ⅱ
    - sw_l2:801194.SI   # 保险Ⅱ
