# 行业名规范字典（industry-context Phase 2，B1 优化）
# 单一事实来源：行业 key（classification_standard:code）↔ 显示名 + 别名 + 行业组。
# key 一律为 "sw_l1:801780.SI" 形式（与 IndustryContextArtifact.industry_code 同构，
# 匹配键 = classification_standard + 行业代码，见主计划 B1）。
# 申万代码与 index_classify(src=SW2021) 实测对齐（2026-08）。
#
# 用途：
# - industry_display_name(key)          展示名解析（报告/调试视图）
# - industry_keys_for_name(名称)        中文名 → 行业 key（别名/罗马后缀宽容）
# - industry_in_group(名称, 组)         行业组归属判断（替代 thesis 硬编码中文名集合）
# - keyword_extract_industry(文本)      自由文本兜底抽取（EXTRACTION_HINTS 来自本文件 aliases + l1 派生）

schema_version: 1

