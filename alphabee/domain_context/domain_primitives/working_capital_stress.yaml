# ── 分析原语：营运资本压力 ──────────────────────────────────────────────
# 业务故事：应收/存货/账期的变化揭示"增长质量"——以账期换增长、库存积压往往是盈利质量
#   恶化的先行信号，比利润表更早暴露问题（利润可以靠放宽账期做出来，现金骗不了人）。
# 投资含义：判断增长是否以牺牲回款质量为代价；库存是主动备货（景气）还是被动积压（滞销）。
#   这是最普适的原语，几乎对所有公司都适用，也是 generic_fundamental 兜底框架的成员。
id: working_capital_stress
version: 1
description: >
  应收/存货/账期等营运资本的变化揭示增长质量：以账期换增长、库存积压往往是
  盈利质量恶化的先行信号。
when_to_activate:
  - 通用（几乎所有公司都可考察营运资本）
  - 项目制/To B 信用销售/库存较重行业尤其敏感
key_variables:
  - 应收账款增速 vs 收入增速
  - 存货增速 vs 收入增速
  - 应收周转天数/存货周转天数
  - 经营现金流/净利润
causal_paths:
  - 应收扩张快于收入 -> 以账期换增长 -> 现金不兑现
  - 库存积压 -> 跌价与减值风险
priority_questions:
  - 增长是否以牺牲回款质量为代价？
  - 库存是主动备货还是被动积压？
disconfirming_signals:
  - 应收/存货增速持续高于收入增速
  - 经营现金流长期低于净利润
preferred_sources:
  - 资产负债表应收/存货
  - 现金流量表经营现金流
  - 周转天数序列
report_angles:
  - 增长质量与现金兑现
obsolescence_triggers: []
assumptions: []
