# ── 分析原语：政策冲击 ──────────────────────────────────────────────────
# 业务故事：补贴退坡 / 审批 / 牌照 / 定价管制 / 国产替代依赖等政策变量会直接改变
#   行业的盈利边界与竞争格局，是 A 股「政策敏感赛道」的核心驱动。
# 投资含义：政策方向是外生变量，不能用财务趋势外推——重点判断「政策是否改变盈利
#   边界」以及「公司是否在政策受益/受损一侧」。
id: policy_shock
version: 1
description: >
  政策冲击改变行业盈利边界：补贴退坡、审批/牌照、定价管制、国产替代依赖等
  外生政策变量决定政策敏感赛道的盈利与竞争格局。
when_to_activate:
  - 政策敏感赛道（补贴/审批/牌照/定价管制/国产替代依赖）
  - 公司盈利显著依赖政策补贴或牌照壁垒
key_variables:
  - 补贴退坡幅度与节奏
  - 审批/牌照状态
  - 定价管制方向
  - 国产替代依赖度与政策扶持
causal_paths:
  - 补贴退坡 -> 单瓦/单量盈利边界下移 -> 盈利下修
  - 牌照/审批收紧 -> 供给收缩 -> 存量玩家份额与定价受益
  - 定价管制 -> 毛利率被锚定 -> 盈利弹性受限
priority_questions:
  - 政策变化改变的是盈利边界还是短期情绪？
  - 公司处于政策受益一侧还是受损一侧，弹性多大？
disconfirming_signals:
  - 政策预期落地后盈利未兑现
  - 补贴退坡被技术降本对冲（盈利边界未实质下移）
preferred_sources:
  - 政策文件/发改委/工信部公告
  - 行业补贴退坡时间表
  - 公司补贴收入占比披露
report_angles:
  - 政策敏感赛道的受益/受损定位
obsolescence_triggers: []
assumptions:
  - 政策变量外生、无法由公司财务趋势推导
