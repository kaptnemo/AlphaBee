id: commodity_cycle
version: 1
description: >
  盈利主要由大宗商品/强周期中间品的价格周期驱动（猪价、矿价、面板价、油气、化工品等），
  价格方向决定收入与毛利率的绝大部分变动，盈利弹性显著。
when_to_activate:
  - 主营产品为标准化大宗商品或强周期中间品
  - 毛利率与产品价格高度相关
  - 公司处于资源/农产品/化工/面板等周期行业
key_variables:
  - 产品现货/期货价格
  - 行业供需平衡（产能 vs 需求）
  - 库存水平
  - 公司完全成本与现金成本位置
causal_paths:
  - 供给收缩 -> 价格上行 -> 单位毛利扩张 -> 盈利弹性
  - 高价刺激扩产 -> 供给过剩 -> 价格回落 -> 盈利回吐
  - 需求回暖 -> 库存去化 -> 价格企稳 -> 盈利拐点
priority_questions:
  - 当前处于价格周期的哪个阶段（底部/反转/上行/顶部/回落）？
  - 盈利修复来自价格还是成本？可持续性如何？
  - 公司成本曲线位置是否支撑其穿越周期？
disconfirming_signals:
  - 价格下行而产能仍在扩张
  - 公司成本曲线位置持续劣于同行
  - 需求端出现不可逆的结构性替代
preferred_sources:
  - 商品现货/期货价格序列
  - 行业协会供需与库存数据
  - 公司单季销量/均价/吨毛利披露
  - 行业资本开支与产能投放计划
report_angles:
  - 周期定位：当前是周期底部左侧、右侧，还是顶部？
  - 公司的盈利弹性与安全边际
obsolescence_triggers:
  - 产品差异化定价占比超过一半
  - 价格对利润的解释力（R²）趋势性下降
assumptions: []
