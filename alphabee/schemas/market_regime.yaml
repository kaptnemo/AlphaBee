# ─────────────────────────────────────────
# 利率与流动性 (Interest Rate & Liquidity)
# ─────────────────────────────────────────

cn_10y_yield:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 中债10年期国债到期收益率（%）
  aliases:
    zh: [十年国债收益率, 中债10年期国债, 无风险利率]
    en: [China 10y treasury yield, risk-free rate]
  required_by: []
  source_mappings:
    tushare: [yield_cnbd]
    akshare: [bond_china_yield.10年, bond_zh_us_rate.中国国债收益率10年]

us_10y_yield:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 美国10年期国债收益率（%）
  aliases:
    zh: [美债10年期收益率, 美债收益率]
    en: [US 10y treasury yield]
  required_by: []
  source_mappings:
    tushare: [us_tycr]
    akshare: [bond_zh_us_rate.美国国债收益率10年]

shibor_3m:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 3个月 SHIBOR 报价利率（%）
  aliases:
    zh: [Shibor3M, 三个月Shibor]
    en: [3-month SHIBOR]
  required_by: []
  source_mappings:
    tushare: [shibor]
    akshare: [macro_china_shibor_all.3M-定价]

m1_yoy:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [monthly]
  description: 狭义货币供应量 M1 同比增速（%）
  aliases:
    zh: [M1同比, M1增速]
    en: [M1 YoY growth]
  required_by: []
  source_mappings:
    tushare: [cn_m.m1_yoy]
    akshare: [macro_china_money_supply.货币(M1)-同比增长]

m2_yoy:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [monthly]
  description: 广义货币供应量 M2 同比增速（%）
  aliases:
    zh: [M2同比, M2增速]
    en: [M2 YoY growth]
  required_by: []
  source_mappings:
    tushare: [cn_m.m2_yoy]
    akshare: [macro_china_money_supply.货币和准货币(M2)-同比增长]

m1_m2_gap:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [monthly]
  description: M1-M2 剪刀差（%）= M1同比 - M2同比，反映企业活钱与居民储蓄的相对变化
  aliases:
    zh: [M1-M2剪刀差]
    en: [M1-M2 gap]
  required_by: []
  source_mappings: {}
  notes: 由 m1_yoy - m2_yoy 在 adapter 层计算。

social_financing_increment:
  category: market_regime
  type: float
  unit: CNY_100M
  frequency: [monthly]
  description: 社会融资规模当月增量（亿元）
  aliases:
    zh: [社融增量, 新增社融]
    en: [social financing increment]
  required_by: []
  source_mappings:
    tushare: [sf_month.inc_month]
    akshare: [macro_china_shrzgm.社会融资规模增量]

social_financing_yoy:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [monthly]
  description: 社会融资规模存量同比增速（%）
  aliases:
    zh: [社融存量同比]
    en: [social financing stock YoY]
  required_by: []
  source_mappings: {}
  notes: 当前 akshare macro_china_shrzgm 只提供增量，存量同比需另寻数据源，见 INDEX.yaml field_gaps。

# ─────────────────────────────────────────
# 市场趋势与宽度 (Trend & Breadth)
# ─────────────────────────────────────────

hs300_close:
  category: market_regime
  type: float
  unit: CNY
  frequency: [daily]
  description: 沪深300 收盘点位
  aliases:
    zh: [沪深300收盘, 沪深300点位]
    en: [CSI300 close]
  required_by: []
  source_mappings:
    tushare: [index_daily.close]
    akshare: [stock_zh_index_daily.close]

hs300_ma20:
  category: market_regime
  type: float
  unit: CNY
  frequency: [daily]
  description: 沪深300 20日均线（月线）
  aliases:
    zh: [沪深300 MA20]
    en: [CSI300 20-day MA]
  required_by: []
  source_mappings: {}
  notes: 由 hs300_close 近20个交易日序列计算。

hs300_ma60:
  category: market_regime
  type: float
  unit: CNY
  frequency: [daily]
  description: 沪深300 60日均线（季线）
  aliases:
    zh: [沪深300 MA60]
    en: [CSI300 60-day MA]
  required_by: []
  source_mappings: {}
  notes: 由 hs300_close 近60个交易日序列计算。

hs300_ma250:
  category: market_regime
  type: float
  unit: CNY
  frequency: [daily]
  description: 沪深300 250日均线（年线）
  aliases:
    zh: [沪深300 MA250]
    en: [CSI300 250-day MA]
  required_by: []
  source_mappings: {}
  notes: 由 hs300_close 近250个交易日序列计算。

breadth_above_ma60_pct:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 全市场站上60日均线的股票占比（%），核心宽度指标
  aliases:
    zh: [站上60日线比例, 市场宽度]
    en: [breadth above MA60, percentage above 60d MA]
  required_by: []
  source_mappings: {}
  notes: 需全市场个股日线历史计算，暂无低成本数据源，见 INDEX.yaml field_gaps。

nh_nl_diff:
  category: market_regime
  type: int
  unit: COUNT
  frequency: [daily]
  description: 创新高家数 - 创新低家数（NH-NL）
  aliases:
    zh: [创新高减创新低, NH-NL]
    en: [new highs minus new lows, NH-NL]
  required_by: []
  source_mappings: {}
  notes: 需全市场个股52周高低点数据，暂无低成本数据源，见 INDEX.yaml field_gaps。

up_stock_ratio:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 上涨家数占比（%）= 上涨家数 / (上涨+下跌+平盘)
  aliases:
    zh: [上涨家数占比, 涨跌家数比]
    en: [advancing stocks ratio]
  required_by: []
  source_mappings:
    akshare: [stock_market_activity_legu.上涨]

limit_up_count:
  category: market_regime
  type: int
  unit: COUNT
  frequency: [daily]
  description: 涨停家数
  aliases:
    zh: [涨停家数, 涨停数]
    en: [limit-up count]
  required_by: []
  source_mappings:
    akshare: [stock_market_activity_legu.涨停]

limit_down_count:
  category: market_regime
  type: int
  unit: COUNT
  frequency: [daily]
  description: 跌停家数
  aliases:
    zh: [跌停家数, 跌停数]
    en: [limit-down count]
  required_by: []
  source_mappings:
    akshare: [stock_market_activity_legu.跌停]

# ─────────────────────────────────────────
# 风险偏好 (Risk Preference)
# ─────────────────────────────────────────

market_turnover:
  category: market_regime
  type: float
  unit: CNY_100M
  frequency: [daily]
  description: 沪深两市股票成交额合计（亿元）
  aliases:
    zh: [两市成交额, 成交金额]
    en: [market turnover, total A-share turnover]
  required_by: []
  source_mappings:
    akshare: [stock_sse_deal_daily.成交金额, stock_szse_summary.成交金额]
  notes: 上交所成交金额单位亿元 + 深交所成交金额单位元（÷1e8 后相加）。

margin_balance:
  category: market_regime
  type: float
  unit: CNY_100M
  frequency: [daily]
  description: 沪深两市融资余额合计（亿元），杠杆资金规模
  aliases:
    zh: [融资余额, 两融余额中的融资]
    en: [margin balance, financing balance]
  required_by: []
  source_mappings:
    tushare: [margin]
    akshare: [stock_margin_sse.融资余额, stock_margin_szse.融资余额]
  notes: 上交所单位元（÷1e8），深交所单位亿元，相加为两市融资余额。

etf_net_inflow:
  category: market_regime
  type: float
  unit: CNY_100M
  frequency: [daily]
  description: 股票 ETF 资金净流入（亿元）
  aliases:
    zh: [ETF资金流, ETF净流入]
    en: [ETF net inflow]
  required_by: []
  source_mappings: {}
  notes: 当前无稳定免费数据源，见 INDEX.yaml field_gaps。
