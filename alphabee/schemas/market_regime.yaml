# AlphaBee 内部标准字段 — 市场状态域（Market Regime）
# 覆盖：指数估值、利率与流动性、市场宽度、风险偏好
# 频率：日频为主，宏观指标月频
#
# 说明：本域描述“整个市场”的状态，与 market.yaml（个股行情估值）区分。
# 市场状态引擎（alphabee/market_regime/）只消费本域 canonical 字段。

# ─────────────────────────────────────────
# 指数估值 (Index Valuation)
# ─────────────────────────────────────────

hs300_pe_ttm:
  category: market_regime
  type: float
  unit: RATIO
  frequency: [daily]
  description: 沪深300 滚动市盈率（PE-TTM，整体法）
  aliases:
    zh: [沪深300市盈率, 沪深300PE, HS300 PE]
    en: [CSI300 PE TTM, CSI300 P/E]
  required_by: []
  source_mappings:
    tushare: [index_dailybasic.pe]
    akshare: [stock_index_pe_lg.滚动市盈率]
  notes: 指数代码 000300.SH / sh000300。

hs300_pb:
  category: market_regime
  type: float
  unit: RATIO
  frequency: [daily]
  description: 沪深300 市净率（整体法）
  aliases:
    zh: [沪深300市净率, 沪深300PB]
    en: [CSI300 PB]
  required_by: []
  source_mappings:
    tushare: [index_dailybasic.pb]
    akshare: [stock_index_pb_lg.市净率]

hs300_ep_ttm:
  category: market_regime
  type: float
  unit: PERCENT
  frequency: [daily]
  description: 沪深300 盈利收益率（%）= 100 / 沪深300 PE-TTM，用于计算股债收益差 ERP
  aliases:
    zh: [沪深300盈利收益率, 沪深300EP]
    en: [CSI300 earnings yield]
  required_by: []
  source_mappings: {}
  notes: 由 hs300_pe_ttm 在 adapter 层换算（100 / pe_ttm）。

