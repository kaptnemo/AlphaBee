# 策略参数注册表 v0（P0；docs/implementation/framework/REPORT_CLAIM_FIRST_AND_PARAMS_GOVERNANCE_DESIGN.md §4.3/§4.4/附录 B）
#
# 用途：15 个决策关键常量（10 个 F/E 方向分 + 1 个 coverage + 4 个证据层）的**唯一登记面**。
# 本文件当前只做"盘点 + 可解析"：生产决策代码仍读模块常量，默认值来源仍是
# alphabee/params/models.py 的 frozen dataclass；registry 值/默认值/模块常量三方逐项一致
# 由 tests/params/test_registry.py 钉住（任何漂移立即报错）。
#
# 字段语义（缺省即非法 → 加载期明确报错）：
#   id                 domain.area.name，小写点分、全局唯一
#   value              数值（int/float）；必须落在 bounds 内
#   unit               score | pp | ratio | count | nats
#   domain             midterm | report | data
#   kind               policy | technical（结构常量一律留在代码，不得写入本文件）
#   status             active | shadow | placeholder | frozen | deprecated（见设计 §4.3 状态机）
#   source             backtest | expert | literature | design | placeholder（design = 未校准初值）
#   version            条目自身版本；改值 +1
#   owner              变更责任人
#   review_condition   何时必须复核（样本量/指标）
#   wired_in           绑定的 typed params 字段（"Class.field"，可附加说明文字）；未接线留空并在 notes 说明
#   overridable        是否允许覆盖（frozen 条目只允许 experiment/显式 overrides）
#   bounds             [min, max]；越界配置/覆盖一律 fail-open
#   group / constraint 组约束（anchor_weight + research_weight: group=e_blend, sum=1.0）
#
# 解析优先级（高 → 低；设计 §4.5）：函数显式 overrides（experiment/回放）>
# config.yaml parameters.overrides > registry 本文件 value > dataclass 内置默认。
# 失败语义一律 fail-open（warn + 回退低优先级值），绝不抛给生产调用方。
# 变更纪律：改默认值 = 行为变更 → 必须同步 params/CHANGELOG.md 与 ROADMAP「行为变更登记」。

schema_version: 1
registry_version: 1

